<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a37">
<title>You're invited · Household Finances</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="dash-root" class="fd">
  <form class="fd-card hf-login" id="f" autocomplete="on" hidden>
    <h1>You're invited</h1>
    <p id="what" class="fd-sub"></p>
    <ul id="gets" class="fd-sub" style="margin:0 0 6px;padding-left:20px"></ul>
    <label class="fd-field">Choose a login name<input type="text" name="username" autocomplete="username" autocapitalize="none" required placeholder="e.g. mckenna"></label>
    <label class="fd-field">Choose a password (at least 8 characters)<input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
    <label class="fd-field">Password again<input type="password" name="password2" autocomplete="new-password" required minlength="8"></label>
    <button class="fd-btn" type="submit">Create my login</button>
    <p class="fd-msg err" id="err" hidden></p>
    <p class="fd-sub" style="font-size:13px">Your password is stored only on the computer that hosts this app. Nobody else, including whoever invited you, can see it.</p>
  </form>
  <div class="fd-card hf-login" id="bad" hidden><h1>This invite can't be used</h1><p id="badmsg" class="fd-sub"></p><a class="fd-btn" href="login.html">Go to sign in</a></div>
</main>
<script src="store.js"></script>
<script src="showpw.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id), token = location.hash.slice(1) || new URLSearchParams(location.search).get('t') || '';
  const bad = (m) => { $('badmsg').textContent = m; $('bad').hidden = false; $('f').hidden = true; };
  if (!token) return bad('This link is missing its invite code. Ask for a new link.');
  fetch('/api/join/' + encodeURIComponent(token)).then(async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return bad(j.error || 'This invite link has expired or was already used.');
    $('what').textContent = `${j.from || 'Someone'} invited you to Household Finances${j.name ? ', ' + j.name : ''}. You'll be able to open:`;
    for (const b of j.books) { const li = document.createElement('li'); li.textContent = `${b.name}${b.role === 'view' ? ' (view only)' : ''}`; $('gets').append(li); }
    if (j.newBook) { const li = document.createElement('li'); li.textContent = `${j.newBook} (a new dashboard of your own)`; $('gets').append(li); }
    $('f').hidden = false; $('f').username.focus();
  }).catch(() => bad('Couldn’t reach the server. Make sure you’re on the same Wi-Fi as the computer that hosts it.'));
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target, err = $('err'); err.hidden = true;
    if (f.password.value !== f.password2.value) { err.textContent = 'The passwords don’t match.'; err.hidden = false; return; }
    const r = await fetch('/api/join/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { err.textContent = j.error || 'Something went wrong.'; err.hidden = false; return; }
    location.href = './';
  });
})();
</script>
</body>
</html>
