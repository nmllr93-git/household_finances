# Builds the Larenest server image for Docker (x86-64 and ARM64, e.g. Raspberry Pi 4/5) and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/larenest:<version> and :latest.
# Runs on each release (main pushed to the release branch). Run by hand with "push" off to just test the build.
# Linux runner only (1x minutes); the build copies files, so it takes a couple of minutes.
name: Docker release
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      push:
        description: Publish the image (off = build only, as a test)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        timeout-minutes: 10
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || inputs.push
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (and publish on release)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/larenest:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/larenest:latest
      - name: Smoke test (the image starts and answers)
        run: |
          docker buildx build --load -t larenest:smoke .
          docker run -d --name smoke -e LARENEST_ADMIN_USER=alex -e LARENEST_ADMIN_PASSWORD=password123 -p 8080:8080 larenest:smoke
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/ping && break; sleep 1; done
          curl -fsk https://127.0.0.1:8080/api/ping
          docker logs smoke
