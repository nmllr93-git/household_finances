# Builds the Windows installer on GitHub and publishes it as a release, which the desktop app's
# "Check for updates" reads. Triggered by pushing a tag like v1.0.1 (see desktop/README.md).
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match app version to the tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then cd desktop && npm version "$V" --no-git-tag-version --allow-same-version; fi
      # Installers go to the PUBLIC repo <owner>/household_finances-releases, so the app can check without a password.
      - name: Set the release repo owner
        shell: bash
        run: sed -i "s/GITHUB_OWNER/${GITHUB_REPOSITORY_OWNER}/" desktop/package.json
      - run: npm install
        working-directory: desktop
      - run: npm run release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }} # fine-grained token: Contents read/write on household_finances-releases only
      - run: npm test
