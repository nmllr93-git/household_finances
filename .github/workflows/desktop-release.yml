# Builds the Windows installer (and the Mac apps) and publishes them to the PUBLIC repo <owner>/household_finances-releases,
# which the desktop app's "Check for updates" reads.
# Windows and Linux run automatically when main is pushed to the release branch; the Mac apps only when run by hand (mac_publish).
# Previously: runs automatically when desktop/package.json changes on main, but only publishes if that version
# hasn't been released yet, so bumping "version" is all it takes. Can also be run by hand (Actions → Run workflow).
name: Desktop release
on:
  push:
    branches: [release]   # releases happen only when main is pushed to the release branch (when you ask)
  workflow_dispatch:
    inputs:
      mac_test:
        description: Build the Mac apps as a test download (not published)
        type: boolean
        default: false
      linux_test:
        description: Build the Linux apps and server download as a test (not published)
        type: boolean
        default: false
      mac_publish:
        description: Build the Mac apps and add them to the current version's release (Mac builds are only run by hand, they cost 10x minutes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      new: ${{ steps.ver.outputs.new }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is this version new?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "${GITHUB_REPOSITORY_OWNER}/household_finances-releases" >/dev/null 2>&1; then
            echo "v$V is already released; nothing to do."; echo "new=false" >> "$GITHUB_OUTPUT"
          else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Set the release repo owner
        if: steps.ver.outputs.new == 'true'
        shell: bash
        run: sed -i "s/GITHUB_OWNER/${GITHUB_REPOSITORY_OWNER}/" desktop/package.json
      - run: npm test
        if: steps.ver.outputs.new == 'true'
      - run: npm install
        if: steps.ver.outputs.new == 'true'
        working-directory: desktop
      - run: node scripts/prepare.js && npx electron-builder --win --publish never
        if: steps.ver.outputs.new == 'true'
        working-directory: desktop
      - name: Publish the installer, blockmap and latest.yml in one step
        if: steps.ver.outputs.new == 'true'
        working-directory: desktop/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('../package.json').version")
          node ../../scripts/release-notes.js Desktop "$V" > notes.md
          gh release create "v$V" --repo "${GITHUB_REPOSITORY_OWNER}/household_finances-releases" --title "Desktop $V" --notes-file notes.md --latest *.exe *.blockmap latest.yml

  # Mac: Apple Silicon (arm64) and Intel (x64), each with a matching built-in Node. Added to the same release.
  # Signed with the Developer ID certificate and notarized by Apple when these secrets exist:
  #   MAC_CERT_P12 (base64 .p12), MAC_CERT_PASSWORD, and the App Store Connect key APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8.
  # Without them it builds unsigned (first open: System Settings → Privacy & Security → Open Anyway).
  mac:
    needs: windows
    # by hand only: pushes to the release branch build Windows alone
    if: inputs.mac_publish || inputs.mac_test
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sed -i '' "s/GITHUB_OWNER/${GITHUB_REPOSITORY_OWNER}/" desktop/package.json
      - run: npm install
        working-directory: desktop
      - name: Signing and notarizing setup
        shell: bash
        env: { P8: "${{ secrets.APPSTORE_KEY_P8 }}", KID: "${{ secrets.APPSTORE_KEY_ID }}", ISS: "${{ secrets.APPSTORE_ISSUER_ID }}", P12: "${{ secrets.MAC_CERT_P12 }}", PW: "${{ secrets.MAC_CERT_PASSWORD }}" }
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "$P12" | tr -d ' \r\n' > "$RUNNER_TEMP/cert.b64"
            { echo "CSC_LINK=$(cat "$RUNNER_TEMP/cert.b64")"; echo "CSC_KEY_PASSWORD=$PW"; } >> "$GITHUB_ENV"
            if [ -n "$P8" ] && [ -n "$KID" ] && [ -n "$ISS" ]; then
              printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
              { echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"; echo "APPLE_API_KEY_ID=$KID"; echo "APPLE_API_ISSUER=$ISS"; echo "MAC_FLAGS=-c.mac.notarize=true"; } >> "$GITHUB_ENV"
              echo "Signing with Developer ID and notarizing with the App Store Connect key."
            else echo "Signing with Developer ID (no App Store Connect key, so not notarized)."; fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; echo "MAC_FLAGS=-c.mac.identity=null" >> "$GITHUB_ENV"
            echo "No MAC_CERT_P12 secret: building unsigned."
          fi
      - name: Build for Apple Silicon
        working-directory: desktop
        run: node scripts/prepare.js && npx electron-builder --mac --arm64 --publish never $MAC_FLAGS
      - name: Build for Intel Macs
        working-directory: desktop
        run: |
          NV=$(node -v); curl -fsSL "https://nodejs.org/dist/$NV/node-$NV-darwin-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          FD_NODE_BIN="$RUNNER_TEMP/node-$NV-darwin-x64/bin/node" node scripts/prepare.js && npx electron-builder --mac --x64 --publish never $MAC_FLAGS
      - name: Check the signature
        if: env.HAS_CERT == 'true'
        working-directory: desktop/dist
        run: |
          for a in mac-arm64/Larenest.app mac/Larenest.app; do [ -d "$a" ] && codesign --verify --deep --strict --verbose=2 "$a" && spctl -a -vvv -t exec "$a" || true; done
      - name: Keep the Mac test build as a download
        if: ${{ !inputs.mac_publish }}
        uses: actions/upload-artifact@v4
        with: { name: mac-test, path: desktop/dist/*.dmg, retention-days: 7 }
      - name: Add the Mac files to the release
        if: inputs.mac_publish
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('../package.json').version")
          gh release upload "v$V" --clobber --repo "${GITHUB_REPOSITORY_OWNER}/household_finances-releases" *.dmg latest-mac.yml

  # Linux: AppImage (any distribution, updates itself) and .deb (Debian/Ubuntu/Mint), for x86-64 and ARM64, plus the
  # server download used by the Linux installer (larenest-server-<version>.tar.gz + install-linux.sh). Linux minutes are 1x.
  linux:
    needs: windows
    if: needs.windows.outputs.new == 'true' || inputs.linux_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sed -i "s/GITHUB_OWNER/${GITHUB_REPOSITORY_OWNER}/" desktop/package.json
      - run: npm install
        working-directory: desktop
      - name: Build for x86-64
        working-directory: desktop
        run: node scripts/prepare.js && npx electron-builder --linux --x64 --publish never
      - name: Build for ARM64 (with an ARM64 Node inside)
        working-directory: desktop
        run: |
          NV=$(node -v); curl -fsSL "https://nodejs.org/dist/$NV/node-$NV-linux-arm64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          FD_NODE_BIN="$RUNNER_TEMP/node-$NV-linux-arm64/bin/node" node scripts/prepare.js && npx electron-builder --linux --arm64 --publish never
      - name: Server download for the Linux installer
        run: |
          bash scripts/pack-server.sh desktop/dist
          cp scripts/install-linux.sh desktop/dist/install-linux.sh
          ls -la desktop/dist
      - name: Keep the Linux test build as a download
        if: ${{ inputs.linux_test }}
        uses: actions/upload-artifact@v4
        with: { name: linux-test, path: "desktop/dist/*.AppImage\ndesktop/dist/*.deb\ndesktop/dist/*.tar.gz", retention-days: 7 }
      - name: Add the Linux files to the release
        if: needs.windows.outputs.new == 'true'
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(node -p "require('../package.json').version")
          gh release upload "v$V" --clobber --repo "${GITHUB_REPOSITORY_OWNER}/household_finances-releases" *.AppImage *.deb latest-linux*.yml larenest-server-*.tar.gz install-linux.sh
