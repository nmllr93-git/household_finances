# Compile-only check for the Android app (no signing, nothing published). Runs when something is pushed to the
# "android-check" branch, or by hand. Use it to make sure native changes (like the home-screen widget) build
# before a real release.
name: Android build check
on:
  push:
    branches: [android-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install
          npm run android:add
      - name: Build (debug)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
