<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a37">
<title>Connect · Household Finances</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#1f2a37; --mut:#5b6675; --card:#fff; --line:#d8dde3; --acc:#1f5f8b; --bad:#b3261e; --ok:#1e7a46; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12171d; --fg:#e6e9ed; --mut:#9aa4b0; --card:#1b222b; --line:#2c3540; --acc:#6fb0e0; --bad:#f08a80; --ok:#6fcf97; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:20px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  img { width:56px; height:56px; border-radius:12px; display:block; margin-bottom:12px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p { margin:0 0 14px; color:var(--mut); font-size:.95rem; }
  label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
  input { width:100%; font:inherit; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { font:inherit; font-weight:600; border:0; border-radius:9px; padding:11px 16px; background:var(--acc); color:#fff; cursor:pointer; width:100%; margin-top:12px; }
  button.q { background:transparent; color:var(--acc); border:1px solid var(--line); }
  ul { padding:0; list-style:none; margin:14px 0 0; } li { margin-top:6px; }
  li button { margin:0; text-align:left; background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  #msg { margin-top:12px; min-height:1.3em; font-size:.92rem; } .bad { color:var(--bad); } .ok { color:var(--ok); }
  small { display:block; margin-top:16px; color:var(--mut); }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Connect to your server</h1>
  <p>Enter the address of the computer running Household Finances. You'll sign in on the next screen.</p>
  <form id="f">
    <label for="u">Server address</label>
    <input id="u" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="e.g. 192.168.1.20:8080 or my-pc.tailnet.ts.net:8080">
    <button type="submit">Connect</button>
  </form>
  <div id="msg" role="status"></div>
  <ul id="recent"></ul>
  <small>Away from home? Turn on Tailscale on this device and use your computer's Tailscale name or 100.x address.</small>
</main>
<script>
(function () {
  // Remote mode: the app window opens the server's own pages, so sign-in cookies just work.
  // The saved address lives on this device only.
  const KEY = 'fd-hosts', $ = (id) => document.getElementById(id), msg = $('msg');
  const list = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
  const save = (u) => { try { localStorage.setItem(KEY, JSON.stringify([u, ...list().filter((x) => x !== u)].slice(0, 5))); } catch {} };
  const norm = (v) => { v = String(v || '').trim().replace(/\/+$/, ''); if (!v) return ''; if (!/^https?:\/\//i.test(v)) v = 'http://' + v; if (!/:\d+$/.test(v.replace(/^https?:\/\//, '')) && !/^https:/i.test(v)) v += ':8080'; return v; };
  const say = (t, c) => { msg.textContent = t; msg.className = c || ''; };
  async function go(raw) {
    const u = norm(raw); if (!u) { say('Enter an address.', 'bad'); return; }
    say('Checking ' + u + ' …');
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(u + '/api/ping', { signal: ctl.signal, cache: 'no-store' }); clearTimeout(t);
      const j = await r.json().catch(() => ({}));
      if (j.app !== 'household-finances') { say("Something answered at that address, but it isn't Household Finances. Check the port.", 'bad'); return; }
      save(u); say('Connected. Opening…', 'ok');
      if (window.FDApp && FDApp.openHost) FDApp.openHost(u); else location.href = u + '/';
    } catch (e) {
      clearTimeout(t);
      say("Couldn't reach " + u + '. Check the server is running in host mode, this device is on the same network (or Tailscale is on), and the address and port are right.', 'bad');
    }
  }
  $('f').addEventListener('submit', (e) => { e.preventDefault(); go($('u').value); });
  const failed = new URLSearchParams(location.search).get('failed'); if (failed) say("Couldn't reach " + failed.replace(/\/+$/, '') + '. Is that computer on and running in host mode?', 'bad');
  if (window.FDApp && FDApp.setupAgain && location.protocol === 'file:') { const b = document.createElement('button'); b.type = 'button'; b.className = 'q'; b.textContent = 'Run this computer as the server instead'; b.addEventListener('click', () => FDApp.setupAgain()); document.querySelector('main').append(b); }
  const r = list(); if (r.length) { $('u').value = r[0].replace(/^http:\/\//, '');
    r.forEach((u) => { const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button'; b.textContent = u.replace(/^https?:\/\//, ''); b.addEventListener('click', () => go(u)); li.append(b); $('recent').append(li); }); }
})();
</script>
</body>
</html>
